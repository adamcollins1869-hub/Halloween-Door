<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween Door Voting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#18131f;
      --card:#251d2e;
      --text:#fff8e7;
      --muted:#c9b8d3;
      --accent:#f47c20;
      --accent2:#d85d00;
      --purple:#6f3fa0;
      --border:#493850;
      --success:#62b36f;
      --danger:#c83d3d;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      background:linear-gradient(135deg,#40205c,#6f3fa0);
      border-bottom:4px solid var(--accent);
      padding:22px 20px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:1.9rem;
    }

    header p{
      margin:8px 0 0;
      color:#eadcf2;
    }

    <main>

  <div style="display:flex;gap:10px;margin-bottom:18px;">

    <button
      id="voterTabBtn"
      class="primary"
      type="button"
    >
      Voter
    </button>

    <button
      id="adminTabBtn"
      type="button"
      style="background:#6f3fa0;color:white;"
    >
      Admin
    </button>

  </div>

  <section id="voterView" class="card">

    <h2>Choose Your Favorite Door</h2>

    <p class="muted">
      Select the number of the door you think has the best Halloween decorations.
      Each browser/device may submit one vote per contest.
    </p>

    <form id="voteForm">

      <label for="doorNumber">🚪 Door Number</label>

      <select id="doorNumber" required>
        <option value="">Choose a door...</option>
      </select>

      <button
        id="submitVoteBtn"
        class="primary"
        type="submit"
      >
        Submit Vote
      </button>

    </form>

    <div id="voteMessage" class="message"></div>

  </section>

  <section
    id="adminView"
    class="card"
    style="display:none;"
  >

    <div id="adminLogin">

      <h2>Admin Login</h2>

      <form id="loginForm">

        <label for="adminEmail">Email</label>

        <input
          id="adminEmail"
          type="email"
          required
          style="width:100%;padding:14px;margin-bottom:14px;border-radius:10px;border:1px solid var(--border);"
        >

        <label for="adminPassword">Password</label>

        <input
          id="adminPassword"
          type="password"
          required
          style="width:100%;padding:14px;margin-bottom:18px;border-radius:10px;border:1px solid var(--border);"
        >

        <button
          class="primary"
          type="submit"
        >
          Log In
        </button>

      </form>

      <div id="loginMessage" class="message"></div>

    </div>

    <div
      id="adminPanel"
      style="display:none;"
    >

      <h2>Halloween Door Voting Admin</h2>

      <p class="muted">
        Create contests, add anonymous door numbers,
        open or close voting, and view final results.
      </p>

      <button
        id="logoutBtn"
        type="button"
        style="background:#6f3fa0;color:white;"
      >
        Log Out
      </button>

    </div>

  </section>

</main>

  <script>

    const SUPABASE_URL =
      'https://ckxfewxbptmgvfaqlzjp.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_b8SCdacNPrtX6XMV7slpOg_6mwc9NE6';

    const sb = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  </script>

</body>
</html>
